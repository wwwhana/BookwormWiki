services:
  # Database
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: stash
      POSTGRES_USER: stash
      POSTGRES_PASSWORD: stash_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stash"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # BookwormWiki server + background consolidation
  bookwormwiki:
    build: .
    command: ["serve", "--consolidate-namespaces", "${BOOKWORMWIKI_CONSOLIDATE_NAMESPACES:-${STASH_CONSOLIDATE_NAMESPACES:-/projects}}"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Required
      BOOKWORMWIKI_POSTGRES_DSN: ${BOOKWORMWIKI_POSTGRES_DSN:-${STASH_POSTGRES_DSN:-postgresql://stash:stash_dev_password@postgres:5432/stash?sslmode=disable}}
      BOOKWORMWIKI_VECTOR_DIM: ${BOOKWORMWIKI_VECTOR_DIM:-${STASH_VECTOR_DIM:-1536}}
      BOOKWORMWIKI_MAX_RESULT_SIZE: ${BOOKWORMWIKI_MAX_RESULT_SIZE:-${STASH_MAX_RESULT_SIZE:-10000}}
      # Leave the key empty for local or internal endpoints without authentication.
      BOOKWORMWIKI_OPENAI_API_KEY: ${BOOKWORMWIKI_OPENAI_API_KEY:-${STASH_OPENAI_API_KEY:-}}
      BOOKWORMWIKI_OPENAI_BASE_URL: ${BOOKWORMWIKI_OPENAI_BASE_URL:-${STASH_OPENAI_BASE_URL:-https://api.openai.com/v1}}
      BOOKWORMWIKI_OPENAI_REQUEST_TIMEOUT: ${BOOKWORMWIKI_OPENAI_REQUEST_TIMEOUT:-${STASH_OPENAI_REQUEST_TIMEOUT:-2m}}
      BOOKWORMWIKI_EMBEDDING_MODEL: ${BOOKWORMWIKI_EMBEDDING_MODEL:-${STASH_EMBEDDING_MODEL:-text-embedding-3-small}}
      BOOKWORMWIKI_EMBEDDING_RETRY_INTERVAL: ${BOOKWORMWIKI_EMBEDDING_RETRY_INTERVAL:-${STASH_EMBEDDING_RETRY_INTERVAL:-1m}}
      BOOKWORMWIKI_EMBEDDING_RETRY_MAX_INTERVAL: ${BOOKWORMWIKI_EMBEDDING_RETRY_MAX_INTERVAL:-${STASH_EMBEDDING_RETRY_MAX_INTERVAL:-1h}}
      BOOKWORMWIKI_EMBEDDING_RETRY_BATCH_SIZE: ${BOOKWORMWIKI_EMBEDDING_RETRY_BATCH_SIZE:-${STASH_EMBEDDING_RETRY_BATCH_SIZE:-100}}
      # Set these to the actual model windows. Zero enables adaptive retry when
      # a provider reports a context error but does not publish its limit.
      BOOKWORMWIKI_EMBEDDING_CONTEXT_TOKENS: ${BOOKWORMWIKI_EMBEDDING_CONTEXT_TOKENS:-${STASH_EMBEDDING_CONTEXT_TOKENS:-0}}
      BOOKWORMWIKI_EMBEDDING_CACHE: ${BOOKWORMWIKI_EMBEDDING_CACHE:-${STASH_EMBEDDING_CACHE:-true}}
      BOOKWORMWIKI_REASONER_MODEL: ${BOOKWORMWIKI_REASONER_MODEL:-${STASH_REASONER_MODEL:-gpt-4o-mini}}
      BOOKWORMWIKI_REASONER_CONTEXT_TOKENS: ${BOOKWORMWIKI_REASONER_CONTEXT_TOKENS:-${STASH_REASONER_CONTEXT_TOKENS:-0}}
      BOOKWORMWIKI_REASONER_RESERVED_TOKENS: ${BOOKWORMWIKI_REASONER_RESERVED_TOKENS:-${STASH_REASONER_RESERVED_TOKENS:-4096}}
      BOOKWORMWIKI_CONTEXT_TTL: 1h
      BOOKWORMWIKI_HTTP_ADDR: 0.0.0.0:8080
      BOOKWORMWIKI_MCP_MAX_RESPONSE_BYTES: ${BOOKWORMWIKI_MCP_MAX_RESPONSE_BYTES:-${STASH_MCP_MAX_RESPONSE_BYTES:-32768}}
      BOOKWORMWIKI_MCP_TOOL_TIMEOUT: ${BOOKWORMWIKI_MCP_TOOL_TIMEOUT:-${STASH_MCP_TOOL_TIMEOUT:-2m}}
      BOOKWORMWIKI_LOG_LEVEL: ${BOOKWORMWIKI_LOG_LEVEL:-${STASH_LOG_LEVEL:-info}}
      BOOKWORMWIKI_LOG_FORMAT: ${BOOKWORMWIKI_LOG_FORMAT:-${STASH_LOG_FORMAT:-text}}
      # The container listens beyond loopback, so authentication is required.
      BOOKWORMWIKI_AUTH_MODE: ${BOOKWORMWIKI_AUTH_MODE:-${STASH_AUTH_MODE:-token}}
      BOOKWORMWIKI_AUTH_ISSUER: ${BOOKWORMWIKI_AUTH_ISSUER:-${STASH_AUTH_ISSUER:-}}
      BOOKWORMWIKI_AUTH_CLIENT_ID: ${BOOKWORMWIKI_AUTH_CLIENT_ID:-${STASH_AUTH_CLIENT_ID:-}}
      BOOKWORMWIKI_AUTH_CLIENT_SECRET: ${BOOKWORMWIKI_AUTH_CLIENT_SECRET:-${STASH_AUTH_CLIENT_SECRET:-}}
      BOOKWORMWIKI_AUTH_REDIRECT_URL: ${BOOKWORMWIKI_AUTH_REDIRECT_URL:-${STASH_AUTH_REDIRECT_URL:-}}
      BOOKWORMWIKI_AUTH_API_SECRET: ${BOOKWORMWIKI_AUTH_API_SECRET:-${STASH_AUTH_API_SECRET:-${BOOKWORMWIKI_AUTH_OAUTH_API_SECRET:-${STASH_AUTH_OAUTH_API_SECRET:-}}}}
      # Seals provider API keys stored through Model settings / bookwormwiki llm.
      BOOKWORMWIKI_SECRETS_KEY: ${BOOKWORMWIKI_SECRETS_KEY:-${STASH_SECRETS_KEY:-}}
      BOOKWORMWIKI_SECRETS_KEY_PREVIOUS: ${BOOKWORMWIKI_SECRETS_KEY_PREVIOUS:-${STASH_SECRETS_KEY_PREVIOUS:-}}
      # The published development URL is loopback HTTP. HTTPS deployments must
      # override this with true.
      BOOKWORMWIKI_AUTH_COOKIE_SECURE: ${BOOKWORMWIKI_AUTH_COOKIE_SECURE:-${STASH_AUTH_COOKIE_SECURE:-false}}
      BOOKWORMWIKI_AUTH_TOKEN_TTL: ${BOOKWORMWIKI_AUTH_TOKEN_TTL:-${STASH_AUTH_TOKEN_TTL:-720h}}
      BOOKWORMWIKI_AUTH_STDIO_TOKEN: ${BOOKWORMWIKI_AUTH_STDIO_TOKEN:-${STASH_AUTH_STDIO_TOKEN:-}}
      BOOKWORMWIKI_AUTH_OAUTH_ISSUER: ${BOOKWORMWIKI_AUTH_OAUTH_ISSUER:-${STASH_AUTH_OAUTH_ISSUER:-}}
      BOOKWORMWIKI_AUTH_OAUTH_CLIENT_ID: ${BOOKWORMWIKI_AUTH_OAUTH_CLIENT_ID:-${STASH_AUTH_OAUTH_CLIENT_ID:-}}
      BOOKWORMWIKI_AUTH_OAUTH_CLIENT_SECRET: ${BOOKWORMWIKI_AUTH_OAUTH_CLIENT_SECRET:-${STASH_AUTH_OAUTH_CLIENT_SECRET:-}}
      BOOKWORMWIKI_AUTH_OAUTH_REDIRECT_URL: ${BOOKWORMWIKI_AUTH_OAUTH_REDIRECT_URL:-${STASH_AUTH_OAUTH_REDIRECT_URL:-}}
      BOOKWORMWIKI_AUTH_OAUTH_API_SECRET: ${BOOKWORMWIKI_AUTH_OAUTH_API_SECRET:-${STASH_AUTH_OAUTH_API_SECRET:-}}
      BOOKWORMWIKI_AUTH_OAUTH_COOKIE_SECURE: ${BOOKWORMWIKI_AUTH_OAUTH_COOKIE_SECURE:-${STASH_AUTH_OAUTH_COOKIE_SECURE:-}}
      BOOKWORMWIKI_AUTH_OAUTH_TOKEN_TTL: ${BOOKWORMWIKI_AUTH_OAUTH_TOKEN_TTL:-${STASH_AUTH_OAUTH_TOKEN_TTL:-}}
      BOOKWORMWIKI_AUTH_OAUTH_STDIO_TOKEN: ${BOOKWORMWIKI_AUTH_OAUTH_STDIO_TOKEN:-${STASH_AUTH_OAUTH_STDIO_TOKEN:-}}
      # Optional: expose embedding maintenance to configured OIDC subjects or
      # to a separate X-BookwormWiki-Admin-Token credential.
      BOOKWORMWIKI_ADMIN_SUBJECTS: ${BOOKWORMWIKI_ADMIN_SUBJECTS:-${STASH_ADMIN_SUBJECTS:-}}
      BOOKWORMWIKI_ADMIN_TOKEN: ${BOOKWORMWIKI_ADMIN_TOKEN:-${STASH_ADMIN_TOKEN:-}}
      # First console administrator (username + password login).
      BOOKWORMWIKI_ADMIN_USER: ${BOOKWORMWIKI_ADMIN_USER:-${STASH_ADMIN_USER:-}}
      BOOKWORMWIKI_ADMIN_PASSWORD: ${BOOKWORMWIKI_ADMIN_PASSWORD:-${STASH_ADMIN_PASSWORD:-}}
      BOOKWORMWIKI_AUTH_TRUSTED_NETWORK: ${BOOKWORMWIKI_AUTH_TRUSTED_NETWORK:-${STASH_AUTH_TRUSTED_NETWORK:-false}}
      # Optional consolidation configs
      BOOKWORMWIKI_CONSOLIDATE_NAMESPACES: ${BOOKWORMWIKI_CONSOLIDATE_NAMESPACES:-${STASH_CONSOLIDATE_NAMESPACES:-/projects}}
      BOOKWORMWIKI_CONSOLIDATION_BATCH_SIZE: 100
      BOOKWORMWIKI_CONSOLIDATION_SIMILARITY_THRESHOLD: 0.85
      BOOKWORMWIKI_CONSOLIDATION_DEDUP_THRESHOLD: 0.95
      BOOKWORMWIKI_CONSOLIDATION_WINDOW: 168h
      BOOKWORMWIKI_DECAY_FACTOR: 0.95
      BOOKWORMWIKI_EXPIRY_THRESHOLD: 0.1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bookwormwiki", "env"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
